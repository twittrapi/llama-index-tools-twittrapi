[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-twittrapi"
version = "0.2.0"
description = "LlamaIndex tools for TwittrAPI: read public Twitter/X tweets, profiles, followers and search results. Pay as you go from $0.065 per 1,000 calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "TwittrAPI" }]
maintainers = [{ name = "twittrapi" }]
keywords = ["twitter api", "x api", "twitter scraper", "tweets", "twitter search", "twitter followers", "social media data", "twittrapi", "llama-index", "llamaindex", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "twittrapi>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://twittrapi.com"
Documentation = "https://twittrapi.com/docs"
Source = "https://github.com/twittrapi/llama-index-tools-twittrapi"
Issues = "https://github.com/twittrapi/llama-index-tools-twittrapi/issues"
Changelog = "https://github.com/twittrapi/llama-index-tools-twittrapi/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.twittrapi"

[tool.llamahub.class_authors]
TwittrAPIToolSpec = "twittrapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
